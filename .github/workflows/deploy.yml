
name: auto test and deploy

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt
        working-directory: backend

      - run: python -m pytest
        working-directory: backend
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  deploy-prod:
  
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Backend deploy
        run: curl --fail --request POST "${{ secrets.RENDER_BACKEND_DEPLOY }}"

      - name: Frontend deploy
        run: curl --fail --request POST "${{ secrets.RENDER_FRONTEND_DEPLOY }}"

  deploy-preprod:

    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Backend preprod deploy
        run: curl --fail --request POST "${{ secrets.RENDER_PREPROD_BACKEND_DEPLOY }}"

      - name: Frontend preprod deploy
        run: curl --fail --request POST "${{ secrets.RENDER_PREPROD_FRONTEND_DEPLOY }}"
